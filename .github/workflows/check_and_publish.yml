name: Check and publish

on:
  push:
    branches:
      - "main"
    tags:
      - 'v*.*.*'
      - 'v*.*.*a*'     # alpha (e.g., v0.1.0a1)
      - 'v*.*.*b*'     # beta (e.g., v0.1.0b1)
      - 'v*.*.*rc*'    # release candidate (e.g., v0.1.0rc1)
  pull_request:
    branches:
      - "**"
  workflow_dispatch:
    inputs:
      publish_alpha:
        description: 'Publish alpha package to PyPI'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: "tests (python ${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
    - name: Check out the repo
      uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v10
      with:
        enable-cache: true

    - name: Install test suite dependencies
      working-directory: tests
      run: uv sync --python ${{ matrix.python-version }}

    - name: Run unit tests
      working-directory: tests
      run: make test-unit

    - name: Run e2e tests
      working-directory: tests
      run: make test-e2e

  publish_pypi:
    runs-on: ubuntu-latest
    needs: [tests]
    if: github.ref_type == 'tag'

    steps:
    - name: Check out the repo
      uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v10

    - name: Set package version from tag
      run: |
        VERSION=${GITHUB_REF_NAME#v}
        echo "Publishing version: $VERSION"
        sed -i "s/^version = \".*\"/version = \"$VERSION\"/" pyproject.toml

    - name: Build
      run: uv build

    - name: Publish
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.PYPI_TOKEN }}

  publish_alpha_pypi:
    runs-on: ubuntu-latest
    needs: [tests]
    if: github.event_name == 'workflow_dispatch' && inputs.publish_alpha == true
    environment: manual-gate

    steps:
    - name: Check out the repo
      uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v10

    - name: Generate alpha version suffix
      id: alpha_version
      run: |
        BASE_VERSION=$(grep -m1 '^version = ' pyproject.toml | sed -E 's/version = "([^"]+)"/\1/')
        ALPHA_NUM=$((RANDOM % 9000 + 1000))
        echo "version=${BASE_VERSION}a${ALPHA_NUM}" >> "$GITHUB_OUTPUT"
        echo "Generated alpha version: ${BASE_VERSION}a${ALPHA_NUM}"

    - name: Set package version
      run: |
        sed -i "s/^version = \".*\"/version = \"${{ steps.alpha_version.outputs.version }}\"/" pyproject.toml

    - name: Build
      run: uv build

    - name: Publish
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.PYPI_TOKEN }}
